[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footy"
version = "1.0.0"
description = "Baseline national-team match predictor (Dixon-Coles + Monte Carlo)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.30"]

[project.scripts]
predict = "footy.cli:main"
update-and-simulate = "footy.cli:main_update"
backtest = "footy.cli:main_backtest"

[tool.setuptools.packages.find]
include = ["footy*"]

[tool.pytest.ini_options]
# The environment ships an incompatible pytest-asyncio that crashes on package
# collection (AttributeError: 'Package' object has no attribute 'obj').
# This project uses no asyncio tests, so disable that plugin for clean runs.
addopts = "-p no:asyncio"
testpaths = ["tests"]
